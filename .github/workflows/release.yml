name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    name: Build zip and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build plugin zip
        run: |
          set -e
          rm -rf build && mkdir -p build/pandora-cloud-monitoring
          cp -r pandora-cloud-monitoring.php includes assets uninstall.php readme.txt build/pandora-cloud-monitoring/
          ( cd build && zip -rq ../pandora-cloud-monitoring.zip pandora-cloud-monitoring )

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: pandora-cloud-monitoring.zip
          generate_release_notes: true
